server:
  port: 8080
resilience4j:
 circuitbreaker:
  instances:
   paymentService:
    slidingWindowSize: 5
    minimumNumberOfCalls: 5
    failureRateThreshold: 50
    waitDurationInOpenState: 10s
    permittedNumberOfCallsInHalfOpenState: 2
management:
 endpoints:
  web:
   exposure:
    include: health,metrics,circuitbreakers
